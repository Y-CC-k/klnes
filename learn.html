<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>國字詳細學習頁 — 原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body { font-family: "Noto Sans TC", system-ui, sans-serif; }
      .floaty { animation: floaty 4s ease-in-out infinite; }
      @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .wiggle:hover { animation: wiggle 0.4s ease-in-out; }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-3deg); }
        75% { transform: rotate(3deg); }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              coral: "#FF6B6B",
              peach: "#FFA94D",
              mint: "#51CF66",
              sky: "#4DABF7",
              lavender: "#B197FC",
              butter: "#FFE066",
              ink: "#2D3436",
            },
            borderRadius: { cute: "24px", card: "40px" },
            boxShadow: {
              soft: "0 8px 24px rgba(0,0,0,0.08)",
              card: "0 20px 40px rgba(0,0,0,0.10)",
              btn: "0 8px 20px rgba(255,107,107,0.30)",
              btnHover: "0 16px 32px rgba(255,107,107,0.40)",
              btnActive: "0 4px 12px rgba(255,107,107,0.25)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-pink-50 via-sky-50 to-yellow-50">
    <!-- 頂部標題 -->
    <header class="max-w-6xl mx-auto px-4 pt-6 pb-2 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-4xl">✨</span>
        <h1 class="text-2xl md:text-3xl font-black text-ink">國字詳細學習頁</h1>
      </div>
      <button
        class="px-5 py-2 rounded-cute bg-white shadow-soft text-ink font-bold hover:scale-105 transition"
      >
        ← 返回字表
      </button>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-12 gap-6">
      <!-- 左側：注音與部首資訊 -->
      <aside class="md:col-span-4 space-y-4">
        <div class="bg-white rounded-card shadow-card p-6 border-4 border-butter">
          <h2 class="text-xl font-black text-ink mb-4 flex items-center gap-2">
            <span>📖</span> 基本資訊
          </h2>
          <dl class="space-y-3 text-lg">
            <div class="flex items-center justify-between bg-pink-50 rounded-cute px-4 py-3">
              <dt class="font-bold text-coral">注音</dt>
              <dd class="text-2xl font-black text-ink">ㄒㄩㄝˊ</dd>
            </div>
            <div class="flex items-center justify-between bg-sky-50 rounded-cute px-4 py-3">
              <dt class="font-bold text-sky">拼音</dt>
              <dd class="text-2xl font-black text-ink">xué</dd>
            </div>
            <div class="flex items-center justify-between bg-mint-50 rounded-cute px-4 py-3">
              <dt class="font-bold text-mint">部首</dt>
              <dd class="text-2xl font-black text-ink">子部</dd>
            </div>
            <div class="flex items-center justify-between bg-lavender-50 rounded-cute px-4 py-3">
              <dt class="font-bold text-lavender">總筆畫</dt>
              <dd class="text-2xl font-black text-ink">16 畫</dd>
            </div>
          </dl>
        </div>

        <div class="bg-white rounded-card shadow-soft p-6 border-4 border-mint">
          <h2 class="text-xl font-black text-ink mb-3 flex items-center gap-2">
            <span>💡</span> 釋義
          </h2>
          <p class="text-base leading-relaxed text-gray-700">
            學：學習、模仿、效法。例：學生、學校、學習。
          </p>
        </div>
      </aside>

      <!-- 中央：巨大生字卡片 -->
      <section class="md:col-span-8 flex flex-col items-center">
        <div
          class="w-full max-w-md bg-white rounded-card shadow-card border-4 border-butter p-8 md:p-12 floaty"
        >
          <div class="flex items-center justify-between mb-4">
            <span class="px-4 py-1 rounded-full bg-coral/10 text-coral font-bold text-sm">
              三年級
            </span>
            <span class="text-2xl">🌟</span>
          </div>
          <div class="flex items-center justify-center">
            <span
              class="text-[12rem] md:text-[16rem] leading-none font-black text-ink select-none"
            >
              學
            </span>
          </div>
          <div class="mt-6 text-center">
            <p class="text-lg font-bold text-gray-500">點選下方按鈕開始練習</p>
          </div>
        </div>

        <!-- 下方：大按鈕 -->
        <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-md">
          <button
            class="group flex items-center justify-center gap-3 py-5 px-6 rounded-cute text-white font-black text-xl bg-gradient-to-r from-coral to-peach shadow-btn hover:shadow-btnHover hover:-translate-y-1 hover:scale-[1.02] active:translate-y-1 active:scale-95 active:shadow-btnActive transition-all duration-200 wiggle"
          >
            <span class="text-2xl group-hover:animate-pulse">▶</span>
            播放筆順
          </button>
          <button
            class="group flex items-center justify-center gap-3 py-5 px-6 rounded-cute text-white font-black text-xl bg-gradient-to-r from-sky to-lavender shadow-btn hover:shadow-btnHover hover:-translate-y-1 hover:scale-[1.02] active:translate-y-1 active:scale-95 active:shadow-btnActive transition-all duration-200 wiggle"
          >
            <span class="text-2xl group-hover:animate-pulse">✍️</span>
            線上練寫
          </button>
        </div>
      </section>
    </main>

    <footer class="max-w-6xl mx-auto px-4 pb-8 text-center text-gray-400 text-sm">
      設計原型 ・ Tailwind CSS + HTML ・ CC0 資料
    </footer>
  </body>
</html>
